name: Shellcheck

# Documentation alone does not run the job: minutes are limited while the repository is private
on:
  pull_request:
    paths-ignore: [ "**.md" ]
  push:
    branches: [ main ]
    paths-ignore: [ "**.md" ]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Errors only: the warnings are known and reviewed (quoting in tests, variables shared via source)
      - name: Shellcheck
        run: shellcheck -S error scripts/*.sh tests/*.sh
