# Example config of ONE portal (folder "beispiel" under /srv/hinweise, host beispiel.meldestelle.example.org).
# Copy per portal and replace both. Once per server: hinweise-throttle-zone.conf and hinweise-allow.conf in the http context.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name beispiel.meldestelle.example.org;
	root /srv/hinweise/beispiel/portal;
	index index.php;
	include /etc/nginx/hinweise-language.conf;
	include /etc/nginx/hinweise-throttle.conf;
	include /etc/nginx/hinweise-errors.conf;
	# The privacy notice says no IP is stored. nginx adds "client: <IP>" to every error line at every level,
	# so no access log and no error log either – or filter the IP out (e.g. syslog with a filter in between).
	# The same goes for the global error_log in nginx.conf (TLS and request errors before a server is chosen).
	# PHP errors would vanish too: give the PHP-FPM pool its own log (php_admin_value[error_log] = …).
	access_log off;
	error_log /dev/null;
	log_not_found off;
	ssl_certificate /etc/letsencrypt/live/beispiel.meldestelle.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/beispiel.meldestelle.example.org/privkey.pem;

	location ~ [^/]+\.php$ {
		try_files $fastcgi_script_name =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTP_PROXY "";
		fastcgi_intercept_errors on;   # PHP status codes get the branded error pages too
		fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
	}

	# ^~: else the PHP block above wins and /team/index.php runs without password.
	# New portals have "Anmeldung": "portal" (portal/template): PHP does the login. Only without it (basic auth)
	# enable both auth_basic lines – else /team is unprotected.
	location ^~ /team {
		#auth_basic "Nur interne Meldestelle";
		#auth_basic_user_file /srv/hinweise/beispiel/passwd;
		location ~ [^/]+\.php$ {
			try_files $fastcgi_script_name =404;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param HTTP_PROXY "";
			fastcgi_intercept_errors on;   # PHP status codes get the branded error pages too
			fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
		}
	}
}
