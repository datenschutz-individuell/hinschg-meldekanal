# Branded error pages of the whistleblowing portals; without "=" nginx keeps the original status.
# 401 also applies in the /team block (error_page is inherited), WWW-Authenticate is preserved.
error_page 400 405 /common/error.php?code=400;
error_page 401 /common/error.php?code=401;
error_page 403 /common/error.php?code=403;
error_page 404 /common/error.php?code=404;
# Server errors static: PHP may not be running then
error_page 500 502 503 504 /common/error-50x.html;
