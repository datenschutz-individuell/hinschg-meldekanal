# Per IP 3 reports at once, then one per 30 s (zone: sites/hinweise-throttle-zone.conf).
# log_level warn: rejections don't land in error_log (which runs at "error") – else it would hold the client IP.
limit_req zone=hinweise_melden burst=2 nodelay;
# /team: 21 at once (login with second factor and resend needs 2–4), then one per 2 s
limit_req zone=hinweise_team burst=20 nodelay;
limit_req_status 429;
# Own page instead of the bare nginx page; its URI doesn't count (empty key).
error_page 429 /common/too-many.html;
limit_req_log_level warn;
# settings.json, defaults.json etc. are read by PHP only; never serve them over HTTP (future fields like Debug).
location ~ \.json$ { return 404; }
# Libraries are only included by PHP, never called directly.
location ^~ /common/vendor/ { return 404; }
# Code under /common is only included; served directly are just the stylesheet and the error page.
location ~ ^/common/(?!(style|error)\.php$).*\.php$ { return 404; }
# Features the portal never uses stay off, also for anything injected.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
