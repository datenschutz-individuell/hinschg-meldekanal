# Throttling of new reports on the whistleblowing portals (cause: 342 bot reports in 51 s on one portal).
# Only POST to /melden, /registrieren and /passwort counts; other requests have an empty key and are not limited.
# POST to /team (login, second factor, team work) has its own, looser zone: slows password guessing per sender,
# loose enough for several members behind one NAT.
# The IP lives only in the zone's memory, nothing is written. Server part: /etc/nginx/hinweise-throttle.conf
# IPv6 per /64 (else a bot simply switches address within its network); with abbreviated notation in the
# prefix the pattern doesn't match, then the full address applies.
map $remote_addr $hinweise_absender {
	"~^(?<netz>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"	$netz;
	default			$remote_addr;
}
map "$request_method:$uri" $hinweise_melden_schluessel {
	"~^POST:/(melden|registrieren|passwort)"	$hinweise_absender;
	default			"";
}
limit_req_zone $hinweise_melden_schluessel zone=hinweise_melden:1m rate=2r/m;
map "$request_method:$uri" $hinweise_team_schluessel {
	"~^POST:/team"	$hinweise_absender;
	default			"";
}
limit_req_zone $hinweise_team_schluessel zone=hinweise_team:1m rate=30r/m;
