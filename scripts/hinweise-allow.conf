# Whitelist of the whistleblowing portals, once in the http context; hinweise-language.conf answers 404
# for everything else. Backups, settings, vendor code, language files never match. Optional language prefix /xx.
map $uri $hinweise_erlaubt {
	volatile;   # evaluate again after internal redirects (error pages), not cached per request
	default 0;
	"~^(/[a-z]{2})?/?$" 1;
	"~^(/[a-z]{2})?/(index|datenschutz|sitemap)\.php$" 1;
	"~^(/[a-z]{2})?/sitemap\.xml$" 1;
	"~^(/[a-z]{2})?/(melden|bearbeiten|registrieren|passwort)(/|/index\.php)?$" 1;
	"~^(/[a-z]{2})?/team(/|/index\.php|/webauthn\.php|/konto|/konto/|/konto/index\.php)?$" 1;
	# security.txt (RFC 9116) and its policy page, if the operator provides them (static, outside the portal code)
	"~^/\.well-known/security\.txt$" 1;
	"~^/security(/|/[a-z]+\.(css|js))?$" 1;
	# Error pages are reached by internal redirect, which passes this check again
	"~^(/[a-z]{2})?/common/(style\.php|error\.php|error-50x\.html|too-many\.html|mail\.js|qrcode\.js|webauthn\.js|favicon\.ico)$" 1;
	# Customer files in the portal root (check-fonts.php, logo, icons)
	"~^(/[a-z]{2})?/(logo\.svg|fonts\.css|style\.css|font-[a-z0-9-]+\.woff2|LICENSE-[a-z0-9-]+\.txt|favicon\.ico|favicon-(16x16|32x32)\.png|apple-touch-icon\.png|safari-pinned-tab\.svg|site\.webmanifest|robots\.txt)$" 1;
}
