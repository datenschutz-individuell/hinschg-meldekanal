# Language prefix of the whistleblowing portals: /en/… is rewritten internally to /…; PHP reads the language from
# $request_uri (lang.php). Unknown prefixes PHP shows in the browser language. Regex with {} needs quotes.
# Runs before every other server-level rewrite: the prefix rewrite below ends with "last", so rules after it never see /xx/….
# Only known paths (map in hinweise-allow.conf), also below /team (before the ^~ locations)
if ($hinweise_erlaubt = 0) { return 404; }
# Sitemap of the public pages, generated per portal; it lists German URLs only, so /xx/sitemap.xml redirects
rewrite "^/[a-z]{2}/sitemap\.xml$" /sitemap.xml permanent;
rewrite ^/sitemap\.xml$ /sitemap.php last;
rewrite "^/([a-z]{2})$" /$1/ permanent;
rewrite "^/[a-z]{2}(/.*)$" $1 last;
